name: lint

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install system dependencies
        run: apt-get update -qq && apt-get install -y -qq wget git make

      - name: Install mise
        env:
          MISE_VERSION: "2026.8.14"
          MISE_SHA256: "7cd12d6002d5b3c83a89cad79023712faf2a36f9e8b2ee2061dac5135b3de0ed"
        run: |
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          wget -qO "$archive" "https://github.com/jdx/mise/releases/download/v${MISE_VERSION}/mise-v${MISE_VERSION}-linux-x64"
          printf '%s  %s\n' "$MISE_SHA256" "$archive" | sha256sum -c --status
          install -Dm755 "$archive" "$HOME/.local/bin/mise"

      - name: Cache mise tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/mise
          key: mise-${{ hashFiles('.tool-versions') }}

      - name: Install tools
        run: |
          "$HOME/.local/bin/mise" install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Run lint checks
        run: make check

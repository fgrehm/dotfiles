name: lint

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: debian:trixie

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: apt-get update -qq && apt-get install -y -qq wget git make

      - name: Install mise
        run: wget -qO- https://mise.jdx.dev/install.sh | sh

      - name: Cache mise tools
        uses: actions/cache@v5
        with:
          path: ~/.local/share/mise
          key: mise-${{ hashFiles('.tool-versions') }}

      - name: Install tools
        run: |
          "$HOME/.local/bin/mise" install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Run lint checks
        run: make check

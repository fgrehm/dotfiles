# Personal Hyprland window rules.
# Sourced by ~/.config/hypr/hyprland.conf after omarchy defaults and user overrides.

# Float + center transient dialog toolkits so they don't get tiled on tiling
# compositors. Match the toolkit class, not the calling app. Don't pin a size
# rule; these tools size themselves via flags. Don't match on title (too broad).
windowrule = float on, match:class ^(yad|zenity|kdialog)$
windowrule = center on, match:class ^(yad|zenity|kdialog)$
# vim: ft=hyprlang
# ~/.config/hypr/local.conf: machine-specific Hyprland config (not managed by chezmoi).
# This file is sourced by ~/.config/hypr/hyprland.conf after all defaults and tracked
# user config, so anything here overrides prior settings. Add keybindings, window rules,
# or other overrides specific to this machine. chezmoi only creates this file when it is
# missing; local edits are never overwritten by `chezmoi apply`.
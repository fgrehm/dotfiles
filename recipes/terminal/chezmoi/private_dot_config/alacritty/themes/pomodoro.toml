# Pomodoro
# Red focus theme -- visibly tomato background to make focus sessions urgent.

[colors.primary]
background = '#5a1414'
foreground = '#ffe4dc'

[colors.cursor]
text   = '#5a1414'
cursor = '#ffb4a8'

[colors.vi_mode_cursor]
text   = '#5a1414'
cursor = '#ffb4a8'

[colors.selection]
text       = '#5a1414'
background = '#ffc4b8'

[colors.normal]
black   = '#2a0808'
red     = '#ff8a7e'
green   = '#a8c080'
yellow  = '#e0a050'
blue    = '#8aaad0'
magenta = '#e08898'
cyan    = '#8abeb8'
white   = '#f0e0d8'

[colors.bright]
black   = '#4a1010'
red     = '#ffaaa0'
green   = '#bcd098'
yellow  = '#f0c070'
blue    = '#a8c0e0'
magenta = '#f0a8b8'
cyan    = '#a8d0ca'
white   = '#fff4ec'

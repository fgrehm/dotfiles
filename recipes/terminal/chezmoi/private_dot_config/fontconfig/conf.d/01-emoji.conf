<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Append Noto Color Emoji to CaskaydiaMono's fallback list so it ranks above
    Symbola (a black-and-white symbol font) for emoji codepoints. Without this,
    fontconfig picks Symbola first and emoji render as monochrome outlines.
  -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>CaskaydiaMono Nerd Font Mono</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>

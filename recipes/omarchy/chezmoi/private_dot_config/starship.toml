add_newline = false
format = "[$directory$git_branch$git_status]($style)${custom.line_break}$character"

[directory]
truncation_length = 2
style = "cyan"

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format = '[$all_status$ahead_behind]($style) '
style = "cyan"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Insert a newline before the prompt character only inside git repos, so the
# prompt is single-line outside repos and two-line (git info on its own line)
# inside them. This mirrors the old zsh prompt's _precmd_prompt_nl behavior.
[custom.line_break]
command = "echo"
when = true
require_repo = true
format = "\n"

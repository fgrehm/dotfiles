# Reduce omarchy's 14px window padding to 2px. Loaded after omarchy's config
# (config-file entries load after the main file), so it wins over omarchy's
# 14px default. Padding changes only affect new terminals.
# window-padding-balance distributes leftover space (viewport not divisible by
# cell size) across all edges instead of pushing it all to the bottom.
window-padding-x = 2
window-padding-y = 2
window-padding-balance = true

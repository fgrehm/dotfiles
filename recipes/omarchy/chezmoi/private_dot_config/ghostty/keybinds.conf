# Last config-file loaded (after omarchy's default config), so bindings here
# win over omarchy's defaults.
#
# Shift+Enter sends a literal newline so Claude Code (and other TUIs) insert a
# line break instead of submitting. Mirrors the alacritty `chars = "\n"`
# binding in the terminal recipe. Omarchy's default binds `csi:13;2u`, which
# only TUIs with kitty keyboard protocol support parse (others show `;2u` or
# degrade to a plain enter inside zellij).
keybind = shift+enter=text:\n
